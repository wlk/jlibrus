# ---------------------------------------------------------------------------
# jlibrus server configuration. Every value can be overridden with an
# environment variable (upper-case, dots/dashes -> underscores), e.g.
#   app.auth.username  -> APP_AUTH_USERNAME   (APP_USERNAME alias below)
# ---------------------------------------------------------------------------

quarkus.application.name=jlibrus
quarkus.http.port=${PORT:8080}
quarkus.http.proxy.proxy-address-forwarding=${APP_BEHIND_PROXY:false}
quarkus.http.proxy.allow-x-forwarded=${APP_BEHIND_PROXY:false}
quarkus.http.proxy.enable-forwarded-host=${APP_BEHIND_PROXY:false}
quarkus.http.proxy.enable-forwarded-prefix=${APP_BEHIND_PROXY:false}
quarkus.default-locale=${APP_LANGUAGE:pl}
quarkus.banner.enabled=false

# --- application login (single user, no sign-up) ---------------------------
app.auth.username=${APP_USERNAME}
app.auth.password=${APP_PASSWORD}
app.auth.max-failures=${APP_LOGIN_MAX_FAILURES:5}
app.auth.block-window=${APP_LOGIN_BLOCK_WINDOW:PT15M}

quarkus.http.auth.form.enabled=true
# Empty pages: the SPA gets 200/401 instead of redirects.
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.http-only-cookie=true
quarkus.http.auth.form.cookie-same-site=strict
quarkus.http.auth.form.timeout=${APP_SESSION_TIMEOUT:P14D}
quarkus.http.auth.form.new-cookie-interval=PT1M
# 32+ random characters; when unset a random key is generated and sessions end on restart.
quarkus.http.auth.session.encryption-key=${APP_SESSION_KEY:}

quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.public-api.paths=/api/public/*
quarkus.http.auth.permission.public-api.policy=permit

# --- security headers --------------------------------------------------------
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'

# --- database (SQLite default, PostgreSQL via jdbc:postgresql://...) -------
db.url=${DB_URL:jdbc:sqlite:data/jlibrus.db}
db.username=${DB_USERNAME:}
db.password=${DB_PASSWORD:}
db.pool-size=${DB_POOL_SIZE:5}

# --- SMTP for summaries --------------------------------------------------------
quarkus.mailer.from=${SMTP_FROM:jlibrus@localhost}
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:25}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.start-tls=${SMTP_STARTTLS:OPTIONAL}
quarkus.mailer.tls=${SMTP_TLS:false}
quarkus.mailer.mock=${SMTP_MOCK:false}

quarkus.log.category."io.github.wlk.jlibrus".level=${LOG_LEVEL:INFO}

# --- tests -----------------------------------------------------------------
%test.app.auth.username=parent
%test.app.auth.password=test-password
%test.quarkus.http.auth.session.encryption-key=test-encryption-key-0123456789abcdef
%test.quarkus.mailer.mock=true
%test.quarkus.scheduler.enabled=false
%dev.app.auth.username=${APP_USERNAME:parent}
%dev.app.auth.password=${APP_PASSWORD:parent}
%dev.quarkus.mailer.mock=${SMTP_MOCK:true}
%test.db.url=jdbc:sqlite:build/test-db/test-${quarkus.uuid}.db
