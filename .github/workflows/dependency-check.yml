name: OWASP Dependency-Check

# Weekly CVE scan of all runtime dependencies against the NVD. Needs the repository secret NVD_API_KEY
# (free: https://nvd.nist.gov/developers/request-an-api-key); without it the scan is skipped.
on:
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: Dependency-Check (fail on CVSS >= 7)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      # only whether the key exists is visible to every step; the key itself goes to the Scan step alone
      HAS_NVD_KEY: ${{ secrets.NVD_API_KEY != '' }}
    steps:
      - name: Require NVD API key
        if: env.HAS_NVD_KEY != 'true'
        run: echo "::warning::NVD_API_KEY secret not set - skipping Dependency-Check"
      - uses: actions/checkout@v7
        if: env.HAS_NVD_KEY == 'true'
      - uses: actions/setup-java@v6
        if: env.HAS_NVD_KEY == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: env.HAS_NVD_KEY == 'true'
      - name: Cache NVD database
        if: env.HAS_NVD_KEY == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: Scan
        if: env.HAS_NVD_KEY == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAggregate --console=plain
      - name: Upload findings to code scanning
        if: always() && env.HAS_NVD_KEY == 'true' && hashFiles('build/reports/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/dependency-check-report.sarif
          category: owasp-dependency-check
      - name: Upload report
        if: always() && env.HAS_NVD_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
          retention-days: 30
