name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, CRAP gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # Unit + integration tests (mock Librus only, PostgreSQL via Testcontainers) and the CRAP < 10 gate.
      - run: ./gradlew build --console=plain
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
          retention-days: 14

  mutation:
    name: Mutation testing (pitest)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :librus-client:pitest :server:pitest --console=plain
      - name: Upload pitest reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-reports
          path: '**/build/reports/pitest/'
          retention-days: 14

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build mock image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: librus-mock
          push: false
          cache-from: type=gha
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
