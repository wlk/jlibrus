[versions]
quarkus = "3.40.1"
opentelemetry = "1.67.0"
# Security pins for transitive dependencies that plugins or the Quarkus platform hold back (see docs/ub-log.md).
jacksonPatched = "2.23.0"
guavaPatched = "33.8.0-jre"
plexusUtilsPatched = "4.0.3"
orgJsonPatched = "20260814"
jackson = "2.23.0"
junit = "6.1.3"
assertj = "3.27.7"
pitest = "1.30.2"
pitestJunit5 = "1.2.3"
pitestPlugin = "1.19.0"
hikari = "7.1.0"
flyway = "13.13.0"
sqlite = "3.54.1.0"
postgres = "42.7.14"
testcontainers = "2.0.5"
jacoco = "0.8.14"
checkstyle = "14.4.0"
pmd = "7.29.0"
spotbugs = "4.10.5"
spotbugsPlugin = "6.5.13"
findsecbugs = "1.14.0"
errorprone = "2.53.0"
errorpronePlugin = "5.2.0"
dependencyCheck = "13.0.0"

[libraries]
jackson-bom-patched = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jacksonPatched" }
guava-patched = { module = "com.google.guava:guava", version.ref = "guavaPatched" }
plexus-utils-patched = { module = "org.codehaus.plexus:plexus-utils", version.ref = "plexusUtilsPatched" }
org-json-patched = { module = "org.json:json", version.ref = "orgJsonPatched" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
postgres-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgres" }
testcontainers-postgres = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }

pmd-cli = { module = "net.sourceforge.pmd:pmd-cli", version.ref = "pmd" }
pmd-java = { module = "net.sourceforge.pmd:pmd-java", version.ref = "pmd" }
findsecbugs = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }

[plugins]
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependencyCheck" }
